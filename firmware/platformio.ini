; Прошивка T-Embed CC1101 для hardware-agent.
; Сборка и прошивка: pio run -t upload   (из папки firmware)
; Монитор порта:     pio device monitor

[env:t_embed]
platform = espressif32@6.13.0      ; та же версия, что у LilyGO
board = t_embed_cc1101             ; boards/t_embed_cc1101.json, взят из репозитория LilyGO
boards_dir = boards
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    mathertel/RotaryEncoder@^1.5.3
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git   ; шрифты с кириллицей
    links2004/WebSockets@^2.6.1                       ; WebSocket-клиент
    bblanchon/ArduinoJson@^7.4.2                      ; разбор и сборка JSON протокола

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1    ; Serial идёт через USB-разъём платы
    -DCORE_DEBUG_LEVEL=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1   ; TFT_eSPI ругается на TOUCH_CS: сенсора у платы нет
    ; Настройки экрана для TFT_eSPI передаём флагами, а не правкой файлов библиотеки.
    ; Значения из lib/TFT_eSPI/User_Setups/Setup214_LilyGo_T_Embed_PN532.h
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_INVERSION_ON=1
    -DTFT_BL=21
    -DTFT_MISO=10
    -DTFT_MOSI=9
    -DTFT_SCLK=11
    -DTFT_CS=41
    -DTFT_DC=16
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
